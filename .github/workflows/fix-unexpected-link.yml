name: Fix unexpected-item link

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-unexpected-link]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace temporary presentation path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('library/index.html')
          s = p.read_text(encoding='utf-8')
          old = '/library/assets/presentations/2023-stretchcon-cadenced-culture-four-dynamics.pdf'
          new = 'https://docs.google.com/presentation/d/1FuQH-DDxQRUZK2lBAmUqziSxYmLYx9IX/edit?usp=sharing'
          if old not in s:
              raise SystemExit('Temporary path not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'antlerboy library publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add library/index.html
          git commit -m 'Fix the unexpected Cadenced culture link'
          git pull --rebase origin main
          git push origin HEAD:main
