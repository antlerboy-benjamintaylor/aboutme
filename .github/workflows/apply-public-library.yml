name: Apply public library revision

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-library]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and apply the revision
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/aboutme-public-library-update.tar.gz
          valid=false
          for url in \
            'https://drive.usercontent.google.com/download?id=1y4Jwtj0DZpdu5HcXT2KAqQPDNlSH-PaS&export=download&confirm=t' \
            'https://drive.google.com/uc?export=download&id=1y4Jwtj0DZpdu5HcXT2KAqQPDNlSH-PaS'; do
            rm -f "$archive"
            if curl -L --fail --retry 3 --retry-delay 2 "$url" -o "$archive" && tar -tzf "$archive" >/dev/null 2>&1; then
              valid=true
              break
            fi
          done
          test "$valid" = true
          tar -xzf "$archive" -C .
          git config user.name 'antlerboy library publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Rebuild the public work library'
          git pull --rebase origin main
          git push origin HEAD:main
