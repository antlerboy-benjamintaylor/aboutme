name: Publish antlerboy.com

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp 404.html _site/404.html
          cp robots.txt _site/robots.txt
          cp sitemap.xml _site/sitemap.xml
          cp CNAME _site/CNAME
          cp -R assets _site/assets
          cp -R library _site/library
          touch _site/.nojekyll
      - name: Refresh the Chosen Path catalogue
        run: node scripts/build-chosen-path-catalogue.mjs _site/library/chosen-path/catalogue.json
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload public site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          include-hidden-files: true
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
